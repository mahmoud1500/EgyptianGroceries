# Render Blueprint — deploys the marketplace from this repo.
# Web service (free tier) + Postgres (free tier). SECRET_KEY is auto-generated.
# NOTE: the start command runs the idempotent seed on every boot so a fresh
# database is never empty (demo vendors, dishes, accounts). Before a real
# production launch, remove `python -m app.seed &&` from startCommand and run
# clean_demo instead.
services:
  - type: web
    name: egyptian-groceries
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: egyptian-groceries-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
databases:
  - name: egyptian-groceries-db
    plan: free
